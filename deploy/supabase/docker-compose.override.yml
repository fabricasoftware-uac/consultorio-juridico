# =====================================================================
# Customizaciones sobre el docker-compose.yml OFICIAL de supabase/docker.
# Clona https://github.com/supabase/supabase (carpeta docker/) en este
# directorio y levanta con:
#
#   docker compose -f docker-compose.yml -f docker-compose.override.yml -p supabase up -d
#
# (config.toml NO se lee en el stack Docker; todo se configura por env.)
# =====================================================================

services:
  db:
    # Postgres 17 (el proyecto usa major_version 17). Verifica el último tag
    # 17.x en https://hub.docker.com/r/supabase/postgres/tags y ajústalo.
    image: supabase/postgres:17.4.1.043

  auth:
    environment:
      # CRÍTICO: activa el custom_access_token_hook, que inyecta el claim
      # `user_role` en el JWT. Sin esto, toda la RLS vía authorize() falla
      # en cerrado (los usuarios no ven sus casos).
      GOTRUE_HOOK_CUSTOM_ACCESS_TOKEN_ENABLED: "true"
      GOTRUE_HOOK_CUSTOM_ACCESS_TOKEN_URI: "pg-functions://postgres/public/custom_access_token_hook"

      # Ingreso con Google para estudiantes. config.toml NO se lee aquí, por eso
      # el proveedor se declara por env. En Google Cloud Console el redirect
      # autorizado es ${API_EXTERNAL_URL}/auth/v1/callback.
      GOTRUE_EXTERNAL_GOOGLE_ENABLED: "true"
      GOTRUE_EXTERNAL_GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOTRUE_EXTERNAL_GOOGLE_SECRET: ${GOOGLE_SECRET}
      GOTRUE_EXTERNAL_GOOGLE_REDIRECT_URI: ${API_EXTERNAL_URL}/auth/v1/callback
      # La lista blanca de destinos post-autenticación la sigue aportando
      # ADDITIONAL_REDIRECT_URLS del .env (ya incluye /auth/callback).

  storage:
    environment:
      # 50 MiB, coherente con config.toml (documentos-casos).
      FILE_SIZE_LIMIT: 52428800
